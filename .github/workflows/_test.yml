run-name: CI test (reusable)
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.16.0'
        description: 'Node.js version to use.'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: npm install
        run: |
          npm ci
          npx puppeteer browsers install chrome
          echo "READER_MAX_WORKERS=2" >> "$GITHUB_ENV"
      - name: get non-redistributable assets
        run: |
          npm run assets:download
          for asset in GeoLite2-City.mmdb geolite2-asn.mmdb SourceHanSansSC-Regular.otf gsa_useragents.txt; do
            test -s "licensed/$asset"
          done

      - name: build application
        run: npm run build

      - name: Futurity regressions
        run: npm run test:futurity

      - name: tests
        run: |
          if [ "$GITHUB_REPOSITORY" = jina-ai/reader ]; then
            npm run test:coverage
          else
            npm test
          fi

      - name: upload coverage to Codecov
        if: github.repository == 'jina-ai/reader'
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
