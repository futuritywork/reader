name: Publish Reader image
run-name: Reader image ${{ github.sha }}
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/oss-image.yml'
      - 'Dockerfile'
      - 'package*.json'
      - 'src/**'
      - 'futurity/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'futuritywork/reader'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.16.0'
          cache: npm
      - name: Build and test application
        run: |
          export OVERRIDE_CHROME_EXECUTABLE_PATH="$(command -v google-chrome)"
          export READER_MAX_WORKERS=2
          npm ci
          npm run assets:download
          npm run build
          npm run test:futurity
          npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build candidate container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: reader-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/futuritywork/reader
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container startup
        run: |
          docker run --rm --memory=2g --cpus=2 --network=none \
            --env NODE_ENV=dry-run --env READER_MAX_WORKERS=2 \
            reader-candidate:"$GITHUB_SHA" build/stand-alone/search.js
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/futuritywork/reader:sha-$GITHUB_SHA"
          docker tag "reader-candidate:$GITHUB_SHA" "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf '### Reader image\n\n    %s\n\nDeploy explicitly using this digest.\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
